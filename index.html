<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- SEO -->
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Play Fortzone Battle Royale, a free online battle royale shooter in your browser.">
  <meta property="og:title" content="Fortzone Battle Royale">
  <meta property="og:description" content="Load and play Fortzone Battle Royale in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo.png">

  <link rel="icon" type="image/png" href="logo.png">

  <title>Fortzone Battle Royale</title>

  <link rel="stylesheet" href="TemplateData/style.css">

  <script>
    const overlayBackgroundColor = "#555555";
    const progressBarFillColor = "#f76426";
    const progressBarBackgroundColor = "#000000";
    const progressBarBorderColor = "#000000";
  </script>

  <!-- Visual SEO + loading text styles -->
  <style>
    :root {
      --brand: #5ee1ff;
      --glow: 0 0 12px rgba(94, 225, 255, .65), 0 0 32px rgba(155, 255, 183, .35);
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #eaf4ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Hidden SEO helper */
    .seo-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }

    /* Loading text + banner styles */
    .sq931-loading-text {
      text-align: center;
      color: #f5f7ff;
      margin-bottom: 8px;
      font-family: inherit;
    }

    .sq931-main-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .03em;
      text-shadow: 0 0 8px rgba(94, 225, 255, .7);
    }

    .sq931-sub-title {
      font-size: 14px;
      font-weight: 600;
      opacity: .9;
      margin-top: 4px;
    }

    #sq931-loading-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .sq931-banner-img {
      max-width: 260px;
      width: 80%;
      height: auto;
      border-radius: 8px;
      box-shadow: var(--glow);
    }

    .sq931-logo-img {
      max-width: 140px;
      width: 50%;
      height: auto;
    }

    @media (max-width: 600px) {
      .sq931-main-title {
        font-size: 16px;
      }

      .sq931-sub-title {
        font-size: 13px;
      }

      .sq931-banner-img {
        max-width: 220px;
      }

      .sq931-logo-img {
        max-width: 120px;
      }
    }
  </style>
</head>

<body class="light">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div class="sq931-loading-text">
        <div class="sq931-sub-title">Fortzone Battle Royale</div>
      </div>

      <img
        src="logo.png"
        alt="Fortzone Battle Royale logo"
        class="sq931-logo-img">

      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    // Leave warning
    window.onbeforeunload = () => "Are you sure you want to leave? Your session may be interrupted.";

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/FortzoneWebGL109.loader.js";

    const config = {
      // dataUrl will be set dynamically
      frameworkUrl: buildUrl + "/FortzoneWebGL109.framework.js.unityweb",
      codeUrl: buildUrl + "/FortzoneWebGL109.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Fahrenheit Dev",
      productName: "Fortzone Battle Royale",
      productVersion: "0.8.8",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== "-" && overlayBackgroundColor !== " " && overlayBackgroundColor !== "")
      canvas.style.background = overlayBackgroundColor;

    if (progressBarFillColor !== "-" && progressBarFillColor !== " " && progressBarFillColor !== "")
      progressBarFull.style.background = progressBarFillColor;

    if (progressBarBackgroundColor !== "-" && progressBarBackgroundColor !== " " && progressBarBackgroundColor !== "")
      progressBarEmpty.style.background = progressBarBackgroundColor;

    if (progressBarBorderColor !== "-" && progressBarBorderColor !== " " && progressBarBorderColor !== "")
      progressBarEmpty.style.borderColor = progressBarBorderColor;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    loadingCover.style.display = "";

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      const partCount = 4;
      const parts = [];
      for (let i = 1; i <= partCount; i++) {
        const partUrl = buildUrl + `/FortzoneWebGL109.data_part${i}.unityweb`;
        try {
          const response = await fetch(partUrl);
          if (!response.ok) {
            throw new Error(`Part ${i} yüklenemedi: ${response.statusText}`);
          }
          const arrayBuffer = await response.arrayBuffer();
          parts.push(arrayBuffer);
          console.log(`Part ${i} yüklendi: ${arrayBuffer.byteLength} byte`);
        } catch (error) {
          console.error(error);
          alert(`Hata: ${error.message}`);
          return;
        }
      }

      let totalLength = 0;
      for (let ab of parts) {
        totalLength += ab.byteLength;
      }
      const merged = new Uint8Array(totalLength);
      let offset = 0;
      for (let ab of parts) {
        merged.set(new Uint8Array(ab), offset);
        offset += ab.byteLength;
      }

      const blob = new Blob([merged], { type: 'application/octet-stream' });
      const dataUrl = URL.createObjectURL(blob);
      config.dataUrl = dataUrl;

      console.log(`Birleştirme tamamlandı. Toplam boyut: ${totalLength} byte`);

      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });
  </script>

  <!-- Hidden SEO block -->
  <div class="seo-hidden" aria-hidden="true">
    <h1>Fortzone Battle Royale</h1>
    <p>Play Fortzone Battle Royale, a free online battle royale shooter in your browser.</p>
  </div>

</body>

</html>
